# Postgres only, for development. Production runs everything from compose.prod.yaml (M7).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: petty
      POSTGRES_PASSWORD: petty
      POSTGRES_DB: petty_tab
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U petty -d petty_tab']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db:
